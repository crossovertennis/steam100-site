<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>STEAM100 — Extended Features</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0d1b2a;--navy2:#12263a;--navy3:#1a3450;
  --gold:#c9a84c;--gold2:#e8c97a;
  --cream:#f8f5ef;--cream2:#f0ebe0;
  --white:#ffffff;--ink:#1c1c1e;--muted:#7a7a8a;--border:#ddd8cc;
  --green:#2e6b4a;--red:#8b2020;--amber:#9a6b10;--blue:#1d3f6e;
}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--cream2);}
::-webkit-scrollbar-thumb{background:var(--gold);}

/* Lock */
#lock{min-height:100vh;background:var(–navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;}
#lock::before{content:’’;position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 80px,rgba(201,168,76,.025) 80px,rgba(201,168,76,.025) 81px);}
.lock-orn{width:40px;height:1px;background:var(–gold);margin-bottom:2rem;position:relative;}
.lock-logo{font-family:‘Cormorant Garamond’,serif;font-size:2.8rem;font-weight:400;color:#fff;letter-spacing:.22em;text-transform:uppercase;position:relative;}
.lock-logo em{color:var(–gold);font-style:normal;}
.lock-tag{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:3rem;position:relative;}
.lock-panel{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);padding:2.5rem;width:100%;max-width:380px;position:relative;}
.lock-title{font-family:‘Cormorant Garamond’,serif;font-size:1.05rem;color:rgba(255,255,255,.55);margin-bottom:1.5rem;font-style:italic;}
.lock-inp{width:100%;background:rgba(255,255,255,.055);border:1px solid rgba(201,168,76,.2);padding:11px 14px;font-family:‘Jost’,sans-serif;font-size:.9rem;color:#fff;letter-spacing:.22em;outline:none;border-radius:0;}
.lock-inp:focus{border-color:var(–gold);}
.lock-inp::placeholder{color:rgba(255,255,255,.18);letter-spacing:.1em;}
.lock-err{font-size:.7rem;color:#e07070;margin-top:.5rem;min-height:1.2rem;}
.lock-btn{width:100%;margin-top:1.25rem;background:var(–gold);color:var(–navy);border:none;padding:12px;font-family:‘Jost’,sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;}
.lock-btn:hover{background:var(–gold2);}

/* App shell */
#app{display:none;min-height:100vh;flex-direction:column;}
.hdr{background:var(–navy);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(201,168,76,.25);}
.hdr-logo{font-family:‘Cormorant Garamond’,serif;font-size:1.35rem;font-weight:400;color:#fff;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}
.hdr-logo em{color:var(–gold);font-style:normal;}
.hdr-right{display:flex;align-items:center;gap:1rem;}
.hdr-role{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.1);padding:3px 10px;}
.hdr-exit{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(–gold);background:transparent;border:1px solid rgba(201,168,76,.35);padding:6px 13px;cursor:pointer;font-family:‘Jost’,sans-serif;}
.hdr-exit:hover{background:rgba(201,168,76,.1);}
.hdr-back{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.5);background:transparent;border:1px solid rgba(255,255,255,.15);padding:6px 13px;cursor:pointer;font-family:‘Jost’,sans-serif;text-decoration:none;}
.hdr-back:hover{color:#fff;}

/* Nav */
.nav{background:var(–navy2);display:flex;padding:0 2rem;border-bottom:1px solid rgba(201,168,76,.12);overflow-x:auto;position:sticky;top:58px;z-index:190;}
.nav::-webkit-scrollbar{height:0;}
.nb{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.36);cursor:pointer;font-family:‘Jost’,sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:14px 17px 12px;white-space:nowrap;transition:all .18s;}
.nb:hover{color:rgba(255,255,255,.7);}
.nb.on{color:var(–gold);border-bottom-color:var(–gold);}

/* Main */
.main{flex:1;padding:2.25rem 2.5rem 5rem;max-width:1200px;width:100%;margin:0 auto;}

/* Components */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem;padding-bottom:1.1rem;border-bottom:1px solid var(–border);gap:1rem;flex-wrap:wrap;}
.ph-eyebrow{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(–gold);font-weight:600;margin-bottom:.3rem;}
.ph-title{font-family:‘Cormorant Garamond’,serif;font-size:1.9rem;font-weight:400;color:var(–navy);}
.ph-sub{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(–muted);margin-top:.25rem;}
.ph-acts{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;font-family:‘Jost’,sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:8px 15px;transition:all .18s;}
.bn{background:var(–navy);color:#fff;}.bn:hover{background:var(–navy3);}
.bg-btn{background:var(–gold);color:var(–navy);}.bg-btn:hover{background:var(–gold2);}
.bo{background:transparent;color:var(–navy);border:1px solid var(–border);}.bo:hover{border-color:var(–navy);}
.bgh{background:transparent;color:var(–muted);border:1px solid var(–border);}.bgh:hover{color:var(–ink);}
.bgreen{background:var(–green);color:#fff;}
.bsm{padding:5px 10px;font-size:.57rem;}
.tw{background:var(–white);border:1px solid var(–border);}
.tbl{width:100%;border-collapse:collapse;font-size:.81rem;}
.tbl thead tr{border-bottom:2px solid var(–navy);}
.tbl th{text-align:left;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(–navy);padding:10px 13px;background:var(–cream2);}
.tbl td{padding:12px 13px;border-bottom:1px solid var(–cream2);vertical-align:middle;font-weight:300;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:#faf8f3;}
.bdg{display:inline-block;font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;}
.bdg-g{background:#e6f2ec;color:var(–green);}
.bdg-r{background:#f5e6e6;color:var(–red);}
.bdg-a{background:#fdf3e3;color:var(–amber);}
.bdg-b{background:#e3ecf7;color:var(–blue);}
.bdg-x{background:var(–cream2);color:var(–muted);}
.card{background:var(–white);border:1px solid var(–border);padding:1.4rem;margin-bottom:1rem;}
.panel{background:var(–white);border:1px solid var(–border);margin-bottom:1.1rem;}
.panel-hdr{background:var(–navy);padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:‘Cormorant Garamond’,serif;font-size:.95rem;font-weight:400;color:#fff;}
.panel-body{padding:1.1rem 1.25rem;}
.field{margin-bottom:.9rem;}
.field label{display:block;font-size:.57rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(–muted);margin-bottom:4px;}
.inp,.sel,.txta{width:100%;border:1px solid var(–border);padding:9px 11px;font-family:‘Jost’,sans-serif;font-size:.81rem;font-weight:300;color:var(–ink);background:var(–cream);outline:none;transition:border-color .2s;-webkit-appearance:none;border-radius:0;}
.inp:focus,.sel:focus,.txta:focus{border-color:var(–navy);background:var(–white);}
.txta{resize:vertical;min-height:75px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem;}
.overlay{position:fixed;inset:0;background:rgba(13,27,42,.65);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(3px);}
.modal{background:var(–white);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.mhdr{background:var(–navy);padding:1.25rem 1.75rem;display:flex;align-items:center;justify-content:space-between;}
.mhdr-title{font-family:‘Cormorant Garamond’,serif;font-size:1.2rem;font-weight:400;color:#fff;}
.mhdr-close{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:1rem;}
.mhdr-close:hover{color:#fff;}
.mbody{padding:1.75rem;}
.mfoot{padding:1.1rem 1.75rem;border-top:1px solid var(–cream2);display:flex;gap:.6rem;justify-content:flex-end;background:#faf8f4;}
.ibar{background:var(–white);border:1px solid var(–border);border-left:4px solid var(–gold);padding:.9rem 1.1rem;margin-bottom:.9rem;display:flex;gap:.75rem;}
.ibar.green{border-left-color:var(–green);}
.ibar.blue{border-left-color:var(–blue);}
.ibar.amber{border-left-color:var(–amber);}
.ibar-icon{font-size:.95rem;flex-shrink:0;margin-top:1px;}
.ibar-title{font-size:.8rem;font-weight:600;margin-bottom:2px;}
.ibar-body{font-size:.74rem;color:var(–muted);font-weight:300;line-height:1.6;}
.sdiv{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(–muted);font-weight:600;padding-bottom:.5rem;border-bottom:1px solid var(–border);margin:1.75rem 0 1rem;}
.dr{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;border-bottom:1px solid var(–cream2);transition:background .14s;}
.dr:last-child{border-bottom:none;}.dr:hover{background:#faf8f3;}
.dn{font-size:.86rem;font-weight:500;}
.dm{font-size:.67rem;color:var(–muted);margin-top:2px;}
.dl{color:var(–gold);font-size:.68rem;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;}
.dl:hover{color:var(–navy);}
.chk{width:15px;height:15px;flex-shrink:0;border:1px solid var(–border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;}
.chk.on{background:var(–navy);border-color:var(–navy);}
.empty{text-align:center;padding:3rem;color:var(–muted);font-size:.82rem;}
.srow{display:grid;gap:1px;background:var(–border);border:1px solid var(–border);margin-bottom:1.75rem;}
.sc{background:var(–white);padding:1.25rem 1.1rem;}
.sc-n{font-family:‘Cormorant Garamond’,serif;font-size:2.4rem;font-weight:400;line-height:1;color:var(–navy);}
.sc-n.g{color:var(–green);}.sc-n.r{color:var(–red);}.sc-n.a{color:var(–amber);}
.sc-l{font-size:.57rem;letter-spacing:.14em;text-transform:uppercase;color:var(–muted);margin-top:.4rem;font-weight:600;}
.prog{background:var(–cream2);height:4px;}
.pf{height:100%;background:var(–gold);transition:width .4s;}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(–border);border:1px solid var(–border);}
.cal-head{background:var(–navy);color:var(–gold);font-size:.56rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:8px 4px;text-align:center;}
.cal-cell{background:var(–white);min-height:82px;padding:4px 5px;vertical-align:top;}
.cal-day{font-size:.68rem;font-weight:600;color:var(–muted);margin-bottom:3px;}
.cal-cell.today{background:#fdf9f0;}
.cal-dot{font-size:.6rem;padding:2px 4px;margin-bottom:2px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;}
.cal-dot.compliance{background:#f5e6e6;color:var(–red);}
.cal-dot.grant{background:#e3ecf7;color:var(–blue);}
.cal-dot.meeting{background:#e6f2ec;color:var(–green);}
.cal-dot.program{background:#ede9f5;color:#6b3fa0;}
.cal-dot.donor{background:#fdf3e3;color:var(–amber);}

/* Digest */
.digest-box{background:var(–white);border:1px solid var(–border);padding:2rem;font-size:.8rem;font-weight:300;line-height:1.85;white-space:pre-wrap;font-family:‘Jost’,sans-serif;}

/* User guide sections */
.guide-section{background:var(–white);border:1px solid var(–border);padding:1.5rem;margin-bottom:.75rem;}
.guide-q{font-family:‘Cormorant Garamond’,serif;font-size:1rem;font-weight:500;color:var(–navy);margin-bottom:.4rem;}
.guide-a{font-size:.8rem;font-weight:300;color:var(–ink);line-height:1.75;}

/* Roadmap */
.road-item{display:flex;align-items:flex-start;gap:.75rem;padding:.8rem 1rem;border-bottom:1px solid var(–cream2);}
.road-item:last-child{border-bottom:none;}
.road-priority{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;flex-shrink:0;margin-top:1px;}
.road-title{font-size:.84rem;font-weight:500;}
.road-detail{font-size:.7rem;color:var(–muted);margin-top:2px;font-weight:300;}
.road-effort{font-size:.6rem;color:var(–muted);margin-top:2px;}

/* Agenda builder */
.agenda-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(–cream2);}
.agenda-item:last-child{border-bottom:none;}
.agenda-num{font-family:‘Cormorant Garamond’,serif;font-size:1.2rem;color:var(–gold);min-width:24px;flex-shrink:0;}

/* Program card */
.prog-card{background:var(–white);border:1px solid var(–border);border-left:4px solid var(–blue);padding:1.1rem 1.25rem;margin-bottom:.75rem;}
.prog-card.active{border-left-color:var(–green);}
.prog-card.planning{border-left-color:var(–amber);}

/* Donor row */
.donor-row{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;border-bottom:1px solid var(–cream2);transition:background .14s;}
.donor-row:hover{background:#faf8f3;}
.donor-row:last-child{border-bottom:none;}
.donor-avatar{width:32px;height:32px;flex-shrink:0;background:var(–navy);display:flex;align-items:center;justify-content:center;font-family:‘Cormorant Garamond’,serif;font-size:.85rem;color:var(–gold);}

@media(max-width:700px){
.main{padding:1.25rem 1rem 4rem;}
.hdr,.nav{padding-left:1rem;padding-right:1rem;}
.frow,.f3{grid-template-columns:1fr;}
.srow{grid-template-columns:1fr 1fr;}
.cal-grid{grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:50px;}
}
</style>

</head>
<body>

<!-- Lock -->

<div id="lock">
  <div class="lock-orn"></div>
  <div class="lock-logo">STEAM<em>100</em></div>
  <div class="lock-tag">Extended Features</div>
  <div class="lock-panel">
    <div class="lock-title">Enter your access code to continue</div>
    <input class="lock-inp" id="pinInput" type="password" placeholder="Access code" maxlength="4"/>
    <div class="lock-err" id="pinErr"></div>
    <button class="lock-btn" onclick="doLogin()">Enter Platform</button>
  </div>
</div>

<!-- App -->

<div id="app">
  <header class="hdr">
    <div class="hdr-logo" onclick="window.location.href='index.html'">STEAM<em>100</em></div>
    <div class="hdr-right">
      <a href="index.html" class="hdr-back">← Main Dashboard</a>
      <span class="hdr-role" id="roleLabel"></span>
      <button class="hdr-exit" onclick="doLogout()">Sign Out</button>
    </div>
  </header>
  <nav class="nav" id="navBar"></nav>
  <main class="main" id="mainContent"></main>
</div>

<script>
const USERS={"7949":{role:"admin",name:"Lance",label:"Administrator"},"8791":{role:"board",name:"Board",label:"Board Member"},"4321":{role:"staff",name:"Staff",label:"Staff & Volunteer"}};
let currentUser=null;
const $=id=>document.getElementById(id);
const fmt=d=>{try{return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch{return d||"";}};
const fmtMo=d=>new Date(d).toLocaleDateString("en-US",{month:"short"}).toUpperCase();
const fmtDay=d=>new Date(d).getDate();
const fmtNow=()=>new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const daysUntil=d=>Math.round((new Date(d)-new Date())/86400000);
const fmtMoney=n=>"$"+Number(n||0).toLocaleString();
const urgColor=d=>d<0?"var(--red)":d<=21?"var(--amber)":"var(--green)";
const sbadge=s=>{const m={active:"bdg-g",planning:"bdg-a","in-progress":"bdg-b",complete:"bdg-g",pending:"bdg-a",sent:"bdg-g","not-sent":"bdg-a",high:"bdg-r",medium:"bdg-a",low:"bdg-x",open:"bdg-a",resolved:"bdg-g",overdue:"bdg-r"};return"bdg "+(m[s]||"bdg-x");};
const isAdmin=()=>currentUser?.role==="admin";
const isBoard=()=>["admin","board"].includes(currentUser?.role);

// ── LOAD/SAVE shared data ─────────────────────────────────────
function loadData(){
  try{const s=localStorage.getItem("s100_v8");return s?JSON.parse(s):{};}
  catch{return {};}
}
function saveData(d){localStorage.setItem("s100_v8",JSON.stringify(d));}

// Extended data defaults
function ensureExtended(DATA){
  if(!DATA.programs) DATA.programs=[];
  if(!DATA.donors) DATA.donors=[];
  if(!DATA.grantReports) DATA.grantReports=[];
  if(!DATA.coiLog) DATA.coiLog=[];
  if(!DATA.staffDirectory) DATA.staffDirectory=[];
  if(!DATA.agendaTemplates) DATA.agendaTemplates=[
    {id:1,name:"Standard Board Meeting",items:["Call to Order","Confirmation of Quorum","Approval of Previous Minutes","President's Report","Treasurer's Report","Compliance Update","Committee Reports","Old Business","New Business","Action Items Review","Adjournment"]},
  ];
  return DATA;
}

let DATA={};

// ── AUTH ─────────────────────────────────────────────────────
$("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
function doLogin(){
  const pin=$("pinInput").value.trim();
  const u=USERS[pin];
  if(u){
    currentUser=u;
    $("pinErr").textContent="";
    $("lock").style.display="none";
    $("app").style.display="flex";
    $("roleLabel").textContent=u.label;
    DATA=ensureExtended(loadData());
    buildNav();
    showTab("digest");
  } else {
    $("pinErr").textContent="Incorrect access code.";
    $("pinInput").value="";
  }
}
function doLogout(){
  currentUser=null;
  $("lock").style.display="flex";
  $("app").style.display="none";
  $("pinInput").value="";
}

// ── NAV ────────────────────────────────────────────────────────
const ALL_TABS=[
  {id:"digest",    l:"Weekly Digest",   roles:["admin"]},
  {id:"calendar",  l:"Annual Calendar", roles:["admin","board"]},
  {id:"staff",     l:"Staff Directory", roles:["admin","board","staff"]},
  {id:"programs",  l:"Programs",        roles:["admin","board","staff"]},
  {id:"donors",    l:"Donors",          roles:["admin"]},
  {id:"grantreports",l:"Grant Reports", roles:["admin"]},
  {id:"agenda",    l:"Agenda Builder",  roles:["admin","board"]},
  {id:"coi",       l:"COI Log",         roles:["admin"]},
  {id:"userguide", l:"User Guide",      roles:["admin","board","staff"]},
  {id:"roadmap",   l:"Product Roadmap", roles:["admin"]},
];
let activeTab="digest";

function buildNav(){
  const nav=$("navBar");nav.innerHTML="";
  ALL_TABS.filter(t=>t.roles.includes(currentUser.role)).forEach(t=>{
    const btn=document.createElement("button");
    btn.className="nb";btn.textContent=t.l;btn.dataset.tab=t.id;
    btn.onclick=()=>showTab(t.id);
    nav.appendChild(btn);
  });
}
function showTab(id){
  activeTab=id;
  document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.tab===id));
  const mc=$("mainContent");mc.innerHTML="";
  const renders={digest:renderDigest,calendar:renderCalendar,staff:renderStaff,programs:renderPrograms,donors:renderDonors,grantreports:renderGrantReports,agenda:renderAgenda,coi:renderCOI,userguide:renderUserGuide,roadmap:renderRoadmap};
  if(renders[id])renders[id](mc);
}

// ── MODAL ──────────────────────────────────────────────────────
function openModal(title,bodyHTML,footHTML){
  const ov=document.createElement("div");ov.className="overlay";
  const mo=document.createElement("div");mo.className="modal";
  mo.innerHTML=`<div class="mhdr"><div class="mhdr-title">${title}</div><button class="mhdr-close" onclick="this.closest('.overlay').remove()">✕</button></div><div class="mbody">${bodyHTML}</div><div class="mfoot">${footHTML}</div>`;
  ov.appendChild(mo);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  document.body.appendChild(ov);
  return {ov,mo};
}

// ── 1. WEEKLY DIGEST ──────────────────────────────────────────
function renderDigest(mc){
  const overdue=(DATA.compliance||[]).filter(c=>daysUntil(c.due)<0&&!c.submitted);
  const soon=(DATA.compliance||[]).filter(c=>{const d=daysUntil(c.due);return d>=0&&d<=30&&!c.submitted;});
  const filed=(DATA.compliance||[]).filter(c=>c.submitted).length;
  const total=(DATA.compliance||[]).length;
  const pct=total?Math.round(filed/total*100):0;
  const nextMtg=[...(DATA.meetings||[])].filter(m=>daysUntil(m.date)>=0).sort((a,b)=>daysUntil(a.date)-daysUntil(b.date))[0];
  const openTodos=(DATA.todos||[]).filter(t=>!t.done).length;
  const grants=(DATA.grants||[]).filter(g=>!g.submitted);

// ── 2. ANNUAL CALENDAR ─────────────────────────────────────────
function renderCalendar(mc){
  const now=new Date();
  let month=parseInt(mc.dataset.month||now.getMonth());
  let year=parseInt(mc.dataset.year||now.getFullYear());

  const prev=()=>{month--;if(month<0){month=11;year--;}mc.dataset.month=month;mc.dataset.year=year;renderCalendar(mc);};
  const next=()=>{month++;if(month>11){month=0;year++;}mc.dataset.month=month;mc.dataset.year=year;renderCalendar(mc);};

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const monthName=new Date(year,month,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});

  // Build event map
  const events={};
  const addEv=(dateStr,label,type)=>{
    const d=new Date(dateStr);
    if(d.getFullYear()===year&&d.getMonth()===month){
      const k=d.getDate();
      if(!events[k])events[k]=[];
      events[k].push({label:label.slice(0,20),type});
    }
  };
  (DATA.compliance||[]).filter(c=>!c.submitted).forEach(c=>addEv(c.due,c.task,"compliance"));
  (DATA.grants||[]).filter(g=>!g.submitted).forEach(g=>addEv(g.deadline,g.name,"grant"));
  (DATA.meetings||[]).forEach(m=>addEv(m.date,m.title,"meeting"));
  (DATA.programs||[]).forEach(p=>{if(p.startDate)addEv(p.startDate,p.name+" (start)","program");if(p.endDate)addEv(p.endDate,p.name+" (end)","program");});
  (DATA.donors||[]).forEach(d=>{if(d.lastGiftDate)addEv(d.lastGiftDate,d.name+" gift","donor");});

  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  mc.innerHTML=`
  <div class="ph">
    <div><div class="ph-eyebrow">Planning</div><div class="ph-title">Annual Calendar</div><div class="ph-sub">All deadlines, meetings, and programs in one view</div></div>
    <div class="ph-acts">
      <button class="btn bo bsm" onclick="(${prev.toString()})()">← Prev</button>
      <span style="font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--navy)">${monthName}</span>
      <button class="btn bo bsm" onclick="(${next.toString()})()">Next →</button>
    </div>
  </div>
  <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem">
    ${[{type:"compliance",label:"Compliance",bg:"#f5e6e6",c:"var(--red)"},{type:"grant",label:"Grant Deadline",bg:"#e3ecf7",c:"var(--blue)"},{type:"meeting",label:"Meeting",bg:"#e6f2ec",c:"var(--green)"},{type:"program",label:"Program",bg:"#ede9f5",c:"#6b3fa0"},{type:"donor",label:"Donor",bg:"#fdf3e3",c:"var(--amber)"}].map(l=>`<span style="font-size:.62rem;padding:3px 9px;background:${l.bg};color:${l.c};font-weight:600;letter-spacing:.08em;text-transform:uppercase">${l.label}</span>`).join("")}
  </div>
  <div class="cal-grid">
    ${days.map(d=>`<div class="cal-head">${d}</div>`).join("")}
    ${cells.map(day=>{
      const isToday=day&&day===now.getDate()&&year===now.getFullYear()&&month===now.getMonth();
      return`<div class="cal-cell${isToday?" today":""}">
        ${day?`<div class="cal-day" style="${isToday?"color:var(--gold);font-weight:700":""}">${day}</div>
        ${(events[day]||[]).map(e=>`<span class="cal-dot ${e.type}">${e.label}</span>`).join("")}`:""}
      </div>`;
    }).join("")}
  </div>`;
}

const text=`STEAM100\n${title}\n${date}\n${"─".repeat(40)}\n\n${items.map((item,i)=>`${i+1}. ${item}`).join("\n\n")}\n\n${"─".repeat(40)}\nTime: _______  Location: _______\nQuorum required: 3 of ${(DATA.board||[]).filter(b=>b.status==="active").length} board members`;

navigator.clipboard?.writeText(window._agendaText||””).then(()=>{

        <div style="width:32px;height:32px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:.85rem;color:var(--gold);flex-shrink:0">${b.name?b.name[0]:"?"}</div>
        <div style="flex:1"><div class="dn">${b.name||"Vacant"}</div><div class="dm">${b.role}</div></div>
        ${entry?.signed?`<span class="bdg bdg-g">✓ Signed ${fmt(entry.signedDate)}</span>`:`<span class="bdg bdg-r">Not Yet Signed</span>`}
        ${isAdmin()&&!entry?.signed?`<button class="btn bgreen bsm" style="margin-left:.5rem" onclick="markCOISigned(${b.id})">Mark Signed ✓</button>`:""}
      </div>`;
    }).join("")}
    ${(DATA.board||[]).filter(b=>b.status==="active").length===0?`<div class="empty">No active board members.</div>`:""}

  <div class="sdiv">Full Disclosure History</div>
  <div class="tw">
    ${log.length===0?`<div class="empty">No disclosures recorded yet.</div>`:`
    <table class="tbl"><thead><tr><th>Board Member</th><th>Year</th><th>Signed</th><th>Has Disclosure</th><th>Disclosure Detail</th><th></th></tr></thead>

    </tr>`}).join("")}</tbody></table>`}
  </div>`;
}
function markCOISigned(boardMemberId){
  if(!DATA.coiLog)DATA.coiLog=[];
  const year=new Date().getFullYear();
  const member=(DATA.board||[]).find(b=>b.id===boardMemberId);
  const existing=DATA.coiLog.find(e=>e.boardMemberId===boardMemberId&&e.year===year);
  if(existing){DATA.coiLog=DATA.coiLog.map(e=>e.boardMemberId===boardMemberId&&e.year===year?{...e,signed:true,signedDate:new Date().toISOString().slice(0,10)}:e);}
  else{DATA.coiLog.push({id:Date.now(),boardMemberId,memberName:member?.name||"",year,signed:true,signedDate:new Date().toISOString().slice(0,10),hasDisclosure:false,disclosureDetail:""});}
  saveData(DATA);renderCOI($("mainContent"));
}
