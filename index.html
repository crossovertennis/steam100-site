function pgEvts(p){
var sel=parseInt(p.dataset.sel||“0”);

if(!ev){
var h=’<div class="ph"><div><div class="ptitle">Events</div><div class="psub">’+D.events.length+’ event(s)</div></div>’;
if(isA())h+=’<button class="btn bng bsm" onclick="addEv()">+ New Event</button>’;

D.events.forEach(function(e){

h+=’<div style="height:4px;background:#ddd8cc"><div style="height:100%;background:#c9a84c;width:'+pct+'%"></div></div></div>’;
});
p.innerHTML=h;return;
}
var dn=ev.tasks.filter(function(t){return t.done;}).length,to=ev.tasks.length,pct=to?Math.round(dn/to*100):0;

h+=’<div class="acts"><button class="btn bno bsm" onclick="clearEv()">Back</button>’;

h+=’<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">’;
h+=’<div class="card"><div style="font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:#c9a84c;font-weight:600;margin-bottom:.4rem">Vision</div><div style="font-family:Cormorant Garamond,serif;font-size:.96rem;line-height:1.8;font-style:italic">’+(ev.vision||“Not set.”)+’</div></div>’;
h+=’<div class="card"><div style="font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:#c9a84c;font-weight:600;margin-bottom:.4rem">Goals</div><div style="font-size:.8rem;font-weight:300;line-height:1.85;white-space:pre-line">’+(ev.goals||“Not set.”)+’</div></div></div>’;
h+=’<div style="background:#fff;border:1px solid #ddd8cc"><div style="background:#0d1b2a;padding:.75rem 1.25rem"><div style="font-family:Cormorant Garamond,serif;font-size:.95rem;color:#fff">Tasks — ‘+dn+’/’+to+’ Complete</div></div>’;
CATS.forEach(function(cat){
if(!grp[cat])return;
h+=’<div style="padding:.9rem 1.25rem;border-bottom:1px solid #f0ebe0">’;
h+=’<div style="font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:#c9a84c;font-weight:700;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #f0ebe0">’+cat+’ — ‘+grp[cat].filter(function(t){return t.done;}).length+’/’+grp[cat].length+’</div>’;
grp[cat].forEach(function(t){
h+=’<div style="display:flex;align-items:flex-start;gap:.65rem;padding:.6rem 0;border-bottom:1px solid #f8f5ef;opacity:'+(t.done?0.65:1)+'">’;

h+=’<div style="flex:1"><div style=“font-size:.82rem;font-weight:500;’+(t.done?“text-decoration:line-through;color:#7a7a8a”:””)+’”>’+t.name+’</div>’;
h+=’<div style="font-size:.65rem;color:#7a7a8a;margin-top:2px">’+(t.due?“Due “+fmtD(t.due):””)+(t.who?” · “+t.who:””)+’</div>’;

if(t.done&&t.doneAt)h+=’<div class="todo-ts">Completed ‘+t.doneAt+’</div>’;
h+=’</div></div>’;
});
h+=’</div>’;
});
h+=’</div>’;
p.innerHTML=h;
}

function setArch(a){el(“pg”).dataset.arch=a;pgDocs(el(“pg”));}
function archDoc(id){D.docs=D.docs.map(function(d){return d.id===id?Object.assign({},d,{arch:!d.arch}):d;});saveD(D);pgDocs(el(“pg”));}
function addDoc(){modal(“Add Document”,’<div class="fld"><label>Name</label><input class="inp" id="dc1"/></div><div class="f2"><div class="fld"><label>Category</label><select class="sel" id="dc2"><option>Governance</option><option>Tax & Legal</option><option>Records</option><option>Finance</option><option>Grants</option><option>HR</option><option>Communications</option></select></div><div class="fld"><label>Date</label><input class="inp" type="date" id="dc3"/></div></div><div class="fld"><label>Google Drive Link</label><input class="inp" id="dc4" placeholder="https://drive.google.com/..."/></div><div class="fld"><label>Notes</label><textarea class="txa" id="dc5"></textarea></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="saveDoc()">Save</button>’);}
function saveDoc(){D.docs.push({id:Date.now(),name:el(“dc1”).value,cat:el(“dc2”).value,date:el(“dc3”).value,link:el(“dc4”).value,notes:el(“dc5”).value,arch:false});saveD(D);closeM();pgDocs(el(“pg”));}
function editDoc(id){var d=D.docs.filter(function(x){return x.id===id;})[0];if(!d)return;modal(“Edit Document”,’<div class="fld"><label>Name</label><input class=“inp” id=“ed1” value=”’+d.name.replace(/”/g,”"”)+’”/></div><div class="f2"><div class="fld"><label>Date</label><input class=“inp” type=“date” id=“ed2” value=”’+(d.date||””)+’”/></div></div><div class="fld"><label>Drive Link</label><input class=“inp” id=“ed3” value=”’+(d.link||””)+’”/></div><div class="fld"><label>Notes</label><textarea class="txa" id="ed4">’+(d.notes||””)+’</textarea></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="updDoc('+id+')">Save</button>’);}
function updDoc(id){D.docs=D.docs.map(function(d){return d.id!==id?d:Object.assign({},d,{name:el(“ed1”).value,date:el(“ed2”).value,link:el(“ed3”).value,notes:el(“ed4”).value});});saveD(D);closeM();pgDocs(el(“pg”));}

// FOLDERS
function pgFold(p){
var MBS=[“Mia”,“Edward”,“Nina”,“Maisha”,“Lance”];
var ac=p.dataset.fm||“Mia”;
var flds=D.folders||{};var items=flds[ac]||[];
var h=’<div class="ph"><div><div class="ptitle">Member Folders</div></div>’;
if(isA())h+=’<button class="btn bnn bsm" onclick="addFI()">+ Add Item</button>’;
h+=’</div><div style="display:flex;gap:0;border-bottom:1px solid #ddd8cc;margin-bottom:1.25rem">’;
MBS.forEach(function(m){h+=’<button class=“ntab ‘+(ac===m?“on”:””)+’” onclick=“setFM('’+m+’'”>’+m+’ (’+((flds[m]||[]).length)+’)</button>’;});
h+=’</div>’;
if(!items.length)h+=’<div class="empty">No items in ‘+ac+”‘s folder yet.</div>”;
items.forEach(function(i){
h+=’<div class="dr"><div style="font-size:1rem">’+(i.type===“Note”?“📝”:“📄”)+’</div><div style="flex:1"><div class="dn">’+i.name+’</div><div class="dm">’+i.type+(i.notes?” · “+i.notes:””)+’</div></div>’;
if(i.link)h+=’<a href="'+i.link+'" target="_blank" class="dl">Open →</a>’;
if(isA())h+=’<button class="btn bno bsm" style="margin-left:.4rem" onclick="rmFI(\''+ac+'\','+i.fid+')">Remove</button>’;
h+=’</div>’;
});
p.innerHTML=h;
}
function setFM(m){el(“pg”).dataset.fm=m;pgFold(el(“pg”));}
function rmFI(mb,fid){if(!D.folders)D.folders={};D.folders[mb]=(D.folders[mb]||[]).filter(function(i){return i.fid!==fid;});saveD(D);pgFold(el(“pg”));}
function addFI(){var ac=el(“pg”).dataset.fm||“Mia”;modal(“Add Item to Folder”,’<div class="fld"><label>Item Name</label><input class="inp" id="fi1"/></div><div class="f2"><div class="fld"><label>Type</label><select class="sel" id="fi2"><option>Note</option><option>Document</option><option>Task</option><option>Resource</option></select></div><div class="fld"><label>Member</label><select class="sel" id="fi3"><option>Mia</option><option>Edward</option><option>Nina</option><option>Maisha</option><option>Lance</option></select></div></div><div class="fld"><label>Drive Link</label><input class="inp" id="fi4" placeholder="https://drive.google.com/..."/></div><div class="fld"><label>Notes</label><textarea class="txa" id="fi5"></textarea></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="saveFI()">Add</button>’);setTimeout(function(){var s=el(“fi3”);if(s)s.value=ac;},50);}
function saveFI(){var mb=el(“fi3”)?el(“fi3”).value:“Mia”;if(!D.folders)D.folders={};if(!D.folders[mb])D.folders[mb]=[];D.folders[mb].push({name:el(“fi1”).value,type:el(“fi2”).value,link:el(“fi4”).value,notes:el(“fi5”).value,fid:Date.now()});saveD(D);closeM();pgFold(el(“pg”));}

// FINANCIALS
function pgFin(p){
var h=’<div class="ph"><div><div class="ptitle">Financials</div><div class="psub">Admin only · Keep 7+ years</div></div><button class="btn bnn bsm" onclick="addFin()">+ Add Record</button></div>’;
h+=’<div class="ibar"><span>🏦</span><div><div class="ititle">Record-Keeping</div><div class="ibody">Upload each bank statement to Google Drive monthly and paste the link here. Minimum 7-year retention required.</div></div></div>’;
h+=’<div class="tw"><table><thead><tr><th>Document</th><th>Month</th><th>Type</th><th>Amount</th><th>Drive</th><th>Status</th><th></th></tr></thead><tbody>’;
D.financials.forEach(function(f){
h+=’<tr style="opacity:'+(f.filed?0.75:1)+'"><td style="font-weight:500">’+f.name+’</td>’;
h+=’<td style="font-weight:300">’+(f.month?new Date(f.month+”-01”).toLocaleDateString(“en-US”,{month:“long”,year:“numeric”}):””)+’</td>’;
h+=’<td><span class="bdg bx">’+f.type+’</span></td>’;
h+=’<td style="font-weight:300">’+(f.amt||”—”)+’</td>’;
h+=’<td>’+(f.link?’<a href="'+f.link+'" target="_blank" class="dl">View →</a>’:’<span style="font-size:.66rem;color:#7a7a8a;font-style:italic">No link</span>’)+’</td>’;
h+=’<td><span class=“bdg ‘+(f.filed?“bg”:“ba”)+’”>’+(f.filed?“Filed”:“Pending”)+’</span></td>’;
h+=’<td><div style="display:flex;gap:3px"><button class="btn bno bsm" onclick="editFin('+f.id+')">Edit</button><button class=“btn bsm ‘+(f.filed?“bno”:“bng”)+’” onclick=“togFin(’+f.id+’)”>’+(f.filed?“Unfile”:“Filed”)+’</button></div></td></tr>’;
});
h+=’</tbody></table></div>’;
p.innerHTML=h;
}
function togFin(id){D.financials=D.financials.map(function(f){return f.id===id?Object.assign({},f,{filed:!f.filed}):f;});saveD(D);pgFin(el(“pg”));}
function addFin(){modal(“Add Financial Record”,’<div class="fld"><label>Document Name</label><input class="inp" id="fn1"/></div><div class="f2"><div class="fld"><label>Month</label><input class="inp" type="month" id="fn2"/></div><div class="fld"><label>Type</label><select class="sel" id="fn3"><option>Bank Statement</option><option>Tax Filing</option><option>Budget</option><option>Expense Report</option><option>Donation Record</option><option>Invoice</option></select></div></div><div class="fld"><label>Amount</label><input class="inp" id="fn4" placeholder="$0.00"/></div><div class="fld"><label>Google Drive Link</label><input class="inp" id="fn5" placeholder="https://drive.google.com/..."/></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="saveFin()">Save</button>’);}
function saveFin(){D.financials.push({id:Date.now(),name:el(“fn1”).value,month:el(“fn2”).value,type:el(“fn3”).value,amt:el(“fn4”).value,link:el(“fn5”).value,filed:false});saveD(D);closeM();pgFin(el(“pg”));}
function editFin(id){var f=D.financials.filter(function(x){return x.id===id;})[0];if(!f)return;modal(“Edit Record”,’<div class="fld"><label>Name</label><input class=“inp” id=“ef1” value=”’+f.name.replace(/”/g,”"”)+’”/></div><div class="f2"><div class="fld"><label>Month</label><input class=“inp” type=“month” id=“ef2” value=”’+(f.month||””)+’”/></div></div><div class="fld"><label>Amount</label><input class=“inp” id=“ef3” value=”’+(f.amt||””)+’”/></div><div class="fld"><label>Drive Link</label><input class=“inp” id=“ef4” value=”’+(f.link||””)+’”/></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="updFin('+id+')">Save</button>’);}
function updFin(id){D.financials=D.financials.map(function(f){return f.id!==id?f:Object.assign({},f,{name:el(“ef1”).value,month:el(“ef2”).value,amt:el(“ef3”).value,link:el(“ef4”).value});});saveD(D);closeM();pgFin(el(“pg”));}

// ISSUES
function pgIss(p){
var h=’<div class="ph"><div><div class="ptitle">Issues & Risks</div><div class="psub">’+D.issues.filter(function(i){return i.status===“open”;}).length+’ open</div></div><button class="btn bnn bsm" onclick="addIss()">+ Log Issue</button></div>’;
D.issues.forEach(function(i){
var col=i.pri===“critical”?”#8b2020”:i.pri===“high”?”#9a6b10”:i.status===“resolved”?”#2e6b4a”:”#9a6b10”;
h+=’<div style=“background:#fff;border:1px solid #ddd8cc;border-left:4px solid ‘+col+’;padding:1rem 1.25rem;margin-bottom:.75rem;opacity:’+(i.status===“resolved”?0.75:1)+’”>’;
h+=’<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><div style="font-weight:600;font-size:.88rem">’+i.title+’</div><div style="font-size:.7rem;color:#7a7a8a;margin-top:2px"><span class="'+sb(i.pri)+'">’+i.pri+’</span> · ‘+i.status+(i.owner?” · “+i.owner:””)+’</div></div>’;
h+=’<div style="display:flex;gap:3px"><button class="btn bno bsm" onclick="editIss('+i.id+')">Edit</button><button class=“btn bsm ‘+(i.status===“open”?“bng”:“bno”)+’” onclick=“togIss(’+i.id+’)”>’+(i.status===“open”?“Resolve”:“Reopen”)+’</button></div></div>’;
if(i.notes)h+=’<div style="font-size:.78rem;font-weight:300;line-height:1.6;margin-top:.5rem">’+i.notes+’</div>’;
if(i.res)h+=’<div style="margin-top:.5rem;font-size:.76rem;color:#2e6b4a;font-weight:300"><strong>Resolution:</strong> ‘+i.res+’</div>’;
h+=’</div>’;
});
p.innerHTML=h;
}
function togIss(id){D.issues=D.issues.map(function(i){return i.id===id?Object.assign({},i,{status:i.status===“open”?“resolved”:“open”}):i;});saveD(D);pgIss(el(“pg”));}
function addIss(){modal(“Log Issue”,’<div class="fld"><label>Title</label><input class="inp" id="is1"/></div><div class="f2"><div class="fld"><label>Priority</label><select class="sel" id="is2"><option>critical</option><option>high</option><option>medium</option><option>low</option></select></div><div class="fld"><label>Owner</label><input class="inp" id="is3" value="Lance"/></div></div><div class="fld"><label>Notes</label><textarea class="txa" id="is4"></textarea></div><div class="fld"><label>Resolution</label><textarea class="txa" id="is5"></textarea></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="saveIss()">Save</button>’);}
function saveIss(){D.issues.push({id:Date.now(),title:el(“is1”).value,pri:el(“is2”).value,status:“open”,owner:el(“is3”).value,notes:el(“is4”).value,res:el(“is5”).value});saveD(D);closeM();pgIss(el(“pg”));}
function editIss(id){var i=D.issues.filter(function(x){return x.id===id;})[0];if(!i)return;modal(“Edit Issue”,’<div class="fld"><label>Title</label><input class=“inp” id=“ei1” value=”’+i.title.replace(/”/g,”"”)+’”/></div><div class="f2"><div class="fld"><label>Priority</label><select class="sel" id="ei2"><option ‘+(i.pri===“critical”?“selected”:””)+’”>critical</option><option ‘+(i.pri===“high”?“selected”:””)+’”>high</option><option ‘+(i.pri===“medium”?“selected”:””)+’”>medium</option><option ‘+(i.pri===“low”?“selected”:””)+’”>low</option></select></div><div class="fld"><label>Owner</label><input class=“inp” id=“ei3” value=”’+(i.owner||””)+’”/></div></div><div class="fld"><label>Notes</label><textarea class="txa" id="ei4">’+(i.notes||””)+’</textarea></div><div class="fld"><label>Resolution</label><textarea class="txa" id="ei5">’+(i.res||””)+’</textarea></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="updIss('+id+')">Save</button>’);}
function updIss(id){D.issues=D.issues.map(function(i){return i.id!==id?i:Object.assign({},i,{title:el(“ei1”).value,pri:el(“ei2”).value,owner:el(“ei3”).value,notes:el(“ei4”).value,res:el(“ei5”).value});});saveD(D);closeM();pgIss(el(“pg”));}

// BYLAWS
function pgByl(p){
var h=’<div class="ph"><div><div class="ptitle">Bylaws</div></div>’;
if(isA())h+=’<button class="btn bnn bsm" onclick="editByl()">Edit</button>’;
h+=’</div><div style="background:#fff;border:1px solid #ddd8cc;padding:2.5rem;max-width:740px"><div style="text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px solid #0d1b2a"><div style="font-family:Cormorant Garamond,serif;font-size:1.8rem;font-weight:700;color:#0d1b2a">STEAM100</div><div style="font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#7a7a8a;margin-top:.3rem">Bylaws of the Corporation</div></div>’;
h+=’<div style="font-size:.84rem;font-weight:300;line-height:1.9">’+(D.bylaws||”<p>Bylaws not yet entered.</p>”)+’</div></div>’;
p.innerHTML=h;
}
function editByl(){modal(“Edit Bylaws”,’<div class="fld"><label>Bylaws (HTML supported)</label><textarea class="txa" id="bl1" style="min-height:280px;font-size:.74rem">’+(D.bylaws||””)+’</textarea></div>’,’<button class="btn bno" onclick="closeM()">Cancel</button><button class="btn bnn" onclick="saveByl()">Save</button>’);}
function saveByl(){D.bylaws=el(“bl1”).value;saveD(D);closeM();pgByl(el(“pg”));}

// BOARD GUIDE
function pgGuide(p){
var qa=[
[“What is this platform?”,“The STEAM100 Private Governance Platform is your secure board operations hub. It contains everything needed to govern the organization: compliance tracking, meetings, grants, votes, documents, and more.”],
[“Access Codes — Keep Confidential”,“Administrator (Lance): 7949 — full access. Board Members (Mia, Edward, Nina, Maisha): 8791 — read-only. Staff and Volunteers: 4321 — events and tasks only.”],
[“Can I accidentally change anything?”,“No. Board member access is completely read-only. There are no edit buttons in your view.”],
[“Where are the actual files stored?”,“Files are stored in Google Drive. This platform shows organized links. Click Open to view any document in Google Drive.”],
[“How do I join a meeting?”,“Go to the Meetings tab and click the Join Meeting link next to your upcoming meeting.”],
[“How do I check compliance status?”,“Go to the Compliance tab for a live score and every filing listed as Filed, Due Soon, or Overdue with direct filing links.”],
[“What are my legal duties?”,“Three core duties: Duty of Care (act with competence), Duty of Loyalty (org above personal interests), Duty of Obedience (follow laws and bylaws). Governance is your role, not day-to-day operations.”]
];
var h=’<div class="ph"><div><div class="ptitle">Board Member Guide</div><div class="psub">How to use this platform</div></div></div>’;
h+=’<div class="ibar g"><span>🔐</span><div><div class="ititle">Access Codes — Confidential</div><div class="ibody">Admin (Lance): <strong>7949</strong>  ·  Board Members: <strong>8791</strong>  ·  Staff: <strong>4321</strong></div></div></div>’;
qa.forEach(function(q){h+=’<div class="card"><div style="font-family:Cormorant Garamond,serif;font-size:1rem;font-weight:500;color:#0d1b2a;margin-bottom:.4rem">◆ ‘+q[0]+’</div><div style="font-size:.8rem;font-weight:300;line-height:1.75">’+q[1]+’</div></div>’;});
p.innerHTML=h;
}
