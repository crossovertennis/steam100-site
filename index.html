// EVENTS
function renderEvents(pc){
var selId=parseInt(pc.dataset.sel||“0”);
var evt=selId?DATA.events.filter(function(e){return e.id===selId;})[0]:null;
var CATS=[“Location & Venue”,“Speakers & Presenters”,“Outreach & Marketing”,“Fundraising”,“Supplies & Materials”,“Grant Support”,“Designated Responsibilities”,“Thank You Letters”,“General”];
if(!evt){
var h=’<div class="page-hdr"><div><div class="page-title">Events</div><div class="page-sub">’+DATA.events.length+’ event(s)</div></div>’;
if(isAdmin())h+=’<button class="btn btn-gold btn-sm" onclick="addEventModal()">+ New Event</button>’;
h+=’</div>’;
DATA.events.forEach(function(e){
var done=e.tasks.filter(function(t){return t.done;}).length,tot=e.tasks.length,pct=tot?Math.round(done/tot*100):0;
h+=’<div class="card" style="cursor:pointer" onclick="selEvt('+e.id+')">’;
h+=’<div style="display:flex;justify-content:space-between;margin-bottom:.5rem"><div style="font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-weight:500">’+e.name+’</div><span class="'+sbadge(e.status)+'">’+e.status+’</span></div>’;
h+=’<div style="font-size:.78rem;color:#7a7a8a;font-weight:300;margin-bottom:.5rem">’+fmtDate(e.date)+’ · ‘+e.location+’</div>’;
h+=’<div style="font-size:.65rem;color:#7a7a8a;margin-bottom:4px">Progress: ‘+pct+’% (’+done+’/’+tot+’ tasks)</div>’;
h+=’<div style="height:4px;background:#ddd8cc"><div style="height:100%;background:#c9a84c;width:'+pct+'%"></div></div></div>’;
});
pc.innerHTML=h;return;
}
var done=evt.tasks.filter(function(t){return t.done;}).length,tot=evt.tasks.length,pct=tot?Math.round(done/tot*100):0;
var grouped={};evt.tasks.forEach(function(t){var c=t.cat||“General”;if(!grouped[c])grouped[c]=[];grouped[c].push(t);});
var h=’<div class="page-hdr"><div><div class="page-title">’+evt.name+’</div><div class="page-sub">’+fmtDate(evt.date)+’ · ‘+evt.location+’</div></div>’;
h+=’<div class="acts"><button class="btn btn-out btn-sm" onclick="clearEvt()">Back</button>’;
if(isAdmin())h+=’<button class="btn btn-gold btn-sm" onclick="addEvtTask('+evt.id+')">+ Task</button>’;
h+=’</div></div>’;
h+=’<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">’;
h+=’<div class="card"><div style="font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:#c9a84c;font-weight:600;margin-bottom:.4rem">Vision</div><div style="font-family:\'Cormorant Garamond\',serif;font-size:.96rem;line-height:1.8;font-style:italic">’+(evt.vision||“Not set.”)+’</div></div>’;
h+=’<div class="card"><div style="font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:#c9a84c;font-weight:600;margin-bottom:.4rem">Goals</div><div style="font-size:.8rem;font-weight:300;line-height:1.85;white-space:pre-line">’+(evt.goals||“Not set.”)+’</div></div></div>’;
h+=’<div style="background:#fff;border:1px solid #ddd8cc">’;
h+=’<div style="background:#0d1b2a;padding:.75rem 1.25rem"><div style="font-family:\'Cormorant Garamond\',serif;font-size:.95rem;color:#fff">Tasks — ‘+done+’/’+tot+’ Complete</div></div>’;
CATS.forEach(function(cat){
if(!grouped[cat])return;
h+=’<div style="padding:.9rem 1.25rem;border-bottom:1px solid #f0ebe0">’;
h+=’<div style="font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:#c9a84c;font-weight:700;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #f0ebe0">’+cat+’ — ‘+grouped[cat].filter(function(t){return t.done;}).length+’/’+grouped[cat].length+’</div>’;
grouped[cat].forEach(function(t){
h+=’<div style="display:flex;align-items:flex-start;gap:.65rem;padding:.6rem 0;border-bottom:1px solid #f8f5ef;opacity:'+(t.done?0.65:1)+'">’;
h+=’<div class=“chk ‘+(t.done?“on”:””)+’” onclick=“togEvtTask(’+evt.id+’,’+t.id+’)”></div>’;
h+=’<div style="flex:1"><div style=“font-size:.82rem;font-weight:500;’+(t.done?“text-decoration:line-through;color:#7a7a8a”:””)+’”>’+t.name+’</div>’;
h+=’<div style="font-size:.65rem;color:#7a7a8a;margin-top:2px">’+(t.due?“Due “+fmtDate(t.due):””)+(t.assignee?” · “+t.assignee:””)+’</div>’;
if(t.note)h+=’<div class="todo-note">’+t.note+’</div>’;
if(t.done&&t.doneAt)h+=’<div class="todo-ts">Completed ‘+t.doneAt+’</div>’;
h+=’</div></div>’;
});
h+=’</div>’;
});
h+=’</div>’;
pc.innerHTML=h;
}
