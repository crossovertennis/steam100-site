<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>STEAM100</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0d1b2a;}
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
h1{color:#ffffff;font-size:2.5rem;letter-spacing:.2em;margin-bottom:.5rem;}
h1 span{color:#c9a84c;}
p{color:#5a7090;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem;}
.box{background:#12263a;border:2px solid #c9a84c;padding:2rem;width:100%;max-width:340px;text-align:center;}
.box h2{color:#c9a84c;font-size:1rem;font-weight:400;margin-bottom:1rem;}
input{width:100%;background:#0d1b2a;border:2px solid #c9a84c;color:#fff;font-size:1.5rem;padding:12px;text-align:center;outline:none;font-family:Arial;margin-bottom:.5rem;}
.err{color:#ff6b6b;font-size:.8rem;min-height:1.2rem;margin-bottom:.5rem;}
button{width:100%;background:#c9a84c;color:#0d1b2a;border:none;padding:14px;font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
#app{display:none;min-height:100vh;background:#f8f5ef;}
.hdr{background:#0d1b2a;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c9a84c;}
.hdr-logo{color:#fff;font-size:1.3rem;letter-spacing:.15em;text-transform:uppercase;font-family:Arial;}
.hdr-logo span{color:#c9a84c;}
.hdr button{background:transparent;border:1px solid #c9a84c;color:#c9a84c;padding:6px 14px;cursor:pointer;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-family:Arial;}
.body{padding:2rem;max-width:800px;margin:0 auto;}
.welcome{font-size:1.8rem;color:#0d1b2a;margin-bottom:.5rem;font-family:Arial;}
.role{color:#7a7a8a;font-size:.8rem;margin-bottom:2rem;}
.success{background:#e6f2ec;border:1px solid #2e6b4a;border-left:4px solid #2e6b4a;padding:1rem 1.25rem;color:#2e6b4a;font-size:.9rem;font-weight:600;}
</style>
</head>
<body>

<div id="lock">
  <h1>STEAM<span>100</span></h1>
  <p>Private Governance Platform</p>
  <div class="box">
    <h2>Enter your access code</h2>
    <input type="password" id="pin" maxlength="4" autocomplete="off" placeholder="----"/>
    <div class="err" id="err">&nbsp;</div>
    <button id="enterBtn">Enter Platform</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-logo">STEAM<span>100</span></div>
    <button id="exitBtn">Sign Out</button>
  </div>
  <div class="body">
    <div class="welcome" id="welcomeMsg">Welcome</div>
    <div class="role" id="roleMsg"></div>
    <div class="success">Login successful. The full platform will load here.</div>
  </div>
</div>

<script>
var PINS = {"7949":["Lance","Administrator"],"8791":["Board","Board Member"],"4321":["Staff","Staff & Volunteer"]};

document.getElementById("pin").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
document.getElementById("enterBtn").addEventListener("click",doLogin);
document.getElementById("exitBtn").addEventListener("click",doLogout);

function doLogin(){
  var p=document.getElementById("pin").value;
  var u=PINS[p];
  if(u){
    document.getElementById("lock").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("welcomeMsg").textContent="Welcome, "+u[0];
    document.getElementById("roleMsg").textContent=u[1];
    document.getElementById("err").innerHTML="&nbsp;";
  } else {
    document.getElementById("err").textContent="Incorrect code. Please try again.";
    document.getElementById("pin").value="";
  }
}
function doLogout(){
  document.getElementById("lock").style.display="flex";
  document.getElementById("app").style.display="none";
  document.getElementById("pin").value="";
  document.getElementById("err").innerHTML="&nbsp;";
}
</script>

</body>
</html>
